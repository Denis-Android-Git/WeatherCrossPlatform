#androidx-espresso-core = "3.6.1"
#androidx-material = "1.12.0"
#androidx-test-junit = "1.2.1"
#junit = "4.13.2"


[libraries]
backdrop = { module = "io.github.kashif-mehmood-km:backdrop", version.ref = "backdrop" }
components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "componentsResources" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "foundation" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
material3-expressive = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3-expressive" }
kotzilla-sdk-compose = { group = "io.kotzilla", name = "kotzilla-sdk-compose", version.ref = "kotzilla" }
# Logging
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanaryAndroid" }
runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "runtime" }
touchlab-kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinSerialization" }

# DataStore
datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

#Firebase
firebase = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-android-bom" }
crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-perf = { module = "com.google.firebase:firebase-perf" }
#Gitlive
gitlive-firebase-kotlin-crashlytics = { module = "dev.gitlive:firebase-crashlytics", version.ref = "firebase-gitlive-sdk" }

#Room
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "roomRuntime" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "roomRuntime" }
material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "materialIconsCore" }
room-runtime-android = { module = "androidx.room:room-runtime-android", version.ref = "roomRuntime" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

#
#kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
#kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
